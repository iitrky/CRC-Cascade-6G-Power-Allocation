[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crc-cascade"
version = "1.0.0"
description = "Conformal risk controlled cascades for neural power allocation in dense 6G subnetworks"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "G. Arul Dalton"}, {name = "S. V. J. Mani"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/iitrky/CRC-Cascade-6G-Power-Allocation"

[tool.setuptools]
packages = ["cspa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
